# =========================================================================
# MNS CAPITAL — Déploiement Docker derrière Caddy
#
# Ce service s'ajoute à votre serveur SANS toucher à la stack « radia-glam ».
# Il rejoint le réseau Docker existant « radia-glam_default » pour que votre
# Caddy puisse l'atteindre par son nom « mnscapital ».
#
# Le routage du nom d'hôte se fait dans le Caddyfile (voir DEPLOIEMENT.md) :
#     mnscapital.167.233.231.68.sslip.io  →  reverse_proxy mnscapital:3000
#
# AVANT DE LANCER : renseignez ADMIN_PASSWORD et SESSION_SECRET dans .env
# =========================================================================

services:
  mnscapital:
    build: .
    container_name: mnscapital
    restart: unless-stopped
    environment:
      - PORT=3000
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Definissez ADMIN_PASSWORD dans .env}
      - SESSION_SECRET=${SESSION_SECRET:?Definissez SESSION_SECRET dans .env}
    volumes:
      # Persistance : contenu et images téléversées conservés au redémarrage.
      - ./content.json:/app/content.json
      - ./public/assets/img:/app/public/assets/img
    networks:
      - web

networks:
  # Réseau EXISTANT de votre stack Caddy (vu via « docker network ls »).
  web:
    external: true
    name: radia-glam_default
